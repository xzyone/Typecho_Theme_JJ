<!doctype html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org" th:fragment="html(head, content, pageTitle, pageDescription, pageKeywords, pageImage, pageUrl, showDirectoryToggle)">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="renderer" content="webkit" />
    <meta http-equiv="Window-target" content="_top" />
    <meta http-equiv="Cache-Control" content="no-transform" />
    <meta http-equiv="Cache-Control" content="no-siteapp" />
    <meta name="Author" th:content="${site.owner != null ? site.owner.displayName : site.title}" />
    <meta name="description" th:content="${pageDescription ?: site.description}" />
    <meta name="keywords" th:content="${pageKeywords ?: site.keywords}" />
    <meta name="title" th:content="${pageTitle ?: site.title}" />
    <meta name="path" th:content="@{/assets}" />
    <meta
      name="theme-config"
      th:attr="data-pagination-type=${theme.config.pagination_type ?: 'infinite'}, data-theme-path=@{/assets}"
    />

    <title th:text="${pageTitle ?: site.title}">JJ Theme</title>

    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/assets/static/images/favicon/apple-touch-icon.png}" />
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/static/images/favicon/favicon-32x32.png}" />
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/static/images/favicon/favicon-16x16.png}" />
    <link rel="manifest" th:href="@{/assets/static/images/favicon/site.webmanifest}" />
    <link rel="mask-icon" th:href="@{/assets/static/images/favicon/safari-pinned-tab.svg}" color="#5bbad5" />
    <link rel="shortcut icon" th:href="@{/assets/static/images/favicon/favicon.ico}" />
    <meta name="msapplication-TileColor" content="#2d89ef" />
    <meta name="msapplication-config" th:content="@{/assets/static/images/favicon/browserconfig.xml}" />
    <meta name="theme-color" content="#ffffff" />

    <meta property="og:type" content="website" />
    <meta property="og:url" th:content="${pageUrl ?: site.url}" />
    <meta property="og:title" th:content="${pageTitle ?: site.title}" />
    <meta property="og:description" th:content="${pageDescription ?: site.description}" />
    <meta property="og:image" th:content="${pageImage ?: site.logo}" />

    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" th:content="${pageUrl ?: site.url}" />
    <meta property="twitter:title" th:content="${pageTitle ?: site.title}" />
    <meta property="twitter:description" th:content="${pageDescription ?: site.description}" />
    <meta property="twitter:image" th:content="${pageImage ?: site.logo}" />

    <link
      rel="stylesheet"
      th:href="@{/assets/static/css/theme/light.css?v={version}(version=${theme.spec.version})}"
      type="text/css"
      title="light"
    />
    <link
      rel="alternate stylesheet"
      th:href="@{/assets/static/css/theme/dark.css?v={version}(version=${theme.spec.version})}"
      type="text/css"
      title="dark"
    />

    <script th:src="@{/assets/static/scripts/globalError.js}"></script>

    <th:block th:if="${theme.config.enable_docsearch}">
      <link rel="preconnect" th:href="|https://${theme.config.docsearch_app_id}-dsn.algolia.net|" crossorigin />
      <script th:inline="javascript">
        (function () {
          var payload = {
            appid: "[[${theme.config.docsearch_app_id}]]",
            apiKey: "[[${theme.config.docsearch_api_key}]]",
            indexName: "[[${theme.config.docsearch_index_name}]]",
            creationTime: Date.now()
          };
          document.cookie = "docsearch=" + encodeURIComponent(JSON.stringify(payload)) + "; path=/";
        })();
      </script>
    </th:block>

    <th:block th:if="${head != null}">
      <th:block th:replace="${head}" />
    </th:block>

    <th:block th:if="${theme.config.head_insert_code != null}" th:utext="${theme.config.head_insert_code}"></th:block>
  </head>
  <body>
    <th:block th:replace="~{partials/header :: header}" />
    <th:block th:replace="${content}" />
    <th:block th:replace="~{partials/fixed-tool :: fixed-tool(showDirectoryToggle=${showDirectoryToggle})}" />
    <th:block th:if="${theme.config.body_insert_code != null}" th:utext="${theme.config.body_insert_code}"></th:block>
  </body>
</html>
