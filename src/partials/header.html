<th:block xmlns:th="https://www.thymeleaf.org" th:fragment="header">
  <header id="header" class="header">
    <div class="header-container">
      <div class="header-content">
        <div class="header-left">
          <a class="header-logo" th:href="@{/}" target="_self">
            <img class="header-logo-pc" th:src="@{/assets/static/images/header/pc-logo.png}" th:alt="${site.title}" />
            <img class="header-logo-mobile" th:src="@{/assets/static/images/header/mobile-logo.png}" th:alt="${site.title}" />
          </a>
          <nav class="header-nav" th:with="menu=${menuFinder.getByName(theme.config.header_menu ?: 'main')}, currentPath=${#httpServletRequest.requestURI}">
            <div class="header-nav-mobile-menu-wrap">
              <div class="header-nav-mobile-menu">
                首页
                <i class="jj-icon jj-icon-down header-nav-mobile-menu-icon"></i>
              </div>
            </div>
            <ul class="header-nav-list">
              <li>
                <a class="header-nav-list-item" th:classappend="${currentPath == '/' ? ' active' : ''}" th:href="@{/}" title="首页">首页</a>
              </li>
              <th:block th:if="${menu != null and menu.menuItems != null}">
                <li th:each="item : ${menu.menuItems}">
                  <a
                    class="header-nav-list-item"
                    th:classappend="${currentPath != null and item.status?.href != null and (currentPath == item.status.href or #strings.endsWith(item.status.href, currentPath)) ? ' active' : ''}"
                    th:href="${item.status.href}"
                    th:attr="target=${(item.spec.target == '_blank' or item.spec.target == 'BLANK' or item.spec.target?.name == 'BLANK') ? '_blank' : '_self'}"
                    th:title="${item.status.displayName}"
                    th:text="${item.status.displayName}"
                  ></a>
                </li>
              </th:block>
            </ul>
          </nav>
        </div>
        <div class="header-right">
          <div class="header-search-icon-wrap">
            <div class="header-search-icon" title="搜索">
              <i class="jj-icon jj-icon-sousuo"></i>
            </div>
          </div>
          <div class="header-search-wrap">
            <form class="header-search-form" method="get" th:action="@{/search}" role="search">
              <input
                id="header-search-input"
                class="header-search-input"
                type="text"
                name="keyword"
                maxlength="40"
                placeholder="输入关键字搜索"
                autocomplete="off"
                th:value="${param.keyword}"
              />
              <label for="header-search-input" class="header-search-btn" tabindex="0">
                <i class="jj-icon jj-icon-sousuo"></i>
              </label>
              <div class="search-history">
                <div class="search-history-head">
                  <span class="search-history-head-title">搜索历史</span>
                  <span class="search-history-clear-btn">清空</span>
                </div>
                <div class="search-history-list"></div>
              </div>
            </form>
            <a
              class="header-article-btn"
              th:if="${#authentication != null and #authentication.authenticated}"
              th:href="@{/console/posts/editor}"
              target="_self"
              title="写文章"
              >写文章</a
            >
          </div>
        </div>
      </div>
    </div>
  </header>
  <div class="mobile-search">
    <div class="mobile-search-mask"></div>
    <div class="mobile-search-content">
      <div class="mobile-search-close">
        <i class="jj-icon jj-icon-guanbi mobile-search-close-icon"></i>
      </div>
      <div class="mobile-search-body"></div>
    </div>
  </div>
</th:block>
